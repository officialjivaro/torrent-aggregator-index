settings:
  name: JTorrent Torrent Aggregator Index
  base_url: https://index.jtorrent.net
  custom_domain: index.jtorrent.net
  output_dir: public
  frontend_origin: https://www.jtorrent.net
  request:
    user_agent: 'JTorrentBackend/0.1 (+https://www.jtorrent.net; contact: no.contact@jtorrent.net)'
    timeout_seconds: 35
    delay_seconds: 0.2
    retries: 2
    max_torrent_bytes: 5242880
  limits:
    max_json_file_bytes: 5242880
    min_total_items: 30000
  state:
    enabled: true
    path: state/catalog.sqlite
    soft_limit_bytes: 68719476736
  publishing:
    r2_bucket: torrent-aggregator-index
    r2_manage_cors: false
    r2_soft_limit_bytes: 68719476736
    keep_r2_versions: 2
    github_repository: officialjivaro/torrent-aggregator-index
    github_asset_soft_limit_bytes: 1932735283
    local_backup_count: 2
  output:
    v4_only: true
    scalable_search:
      enabled: true
      token_bucket_prefix_chars: 2
      max_tokens_per_record: 40
      max_postings_per_token: 50000
      description_max_chars: 240
    legacy_shards: true
    legacy_max_items: 100000
    group_files: false
sources:
- id: ubuntu_official
  name: Official Ubuntu Releases
  type: html_torrent_links
  enabled: true
  category: linux
  source_homepage: https://ubuntu.com/download/alternative-downloads
  copyright_status: open-source
  license: Official Ubuntu release torrents for Ubuntu installation images.
  license_url: https://ubuntu.com/legal/intellectual-property-policy
  page_urls:
  - https://releases.ubuntu.com/
  max_depth: 1
  follow_link_regexes:
  - (?:^|/)(?:[0-9]{2}\.[0-9]{2}|resolute|noble|jammy|focal|questing|plucky)/?$
  include_url_regexes:
  - \.iso\.torrent(?:$|[?#])
  tags:
  - linux
  - ubuntu
  - iso
  - official
  fetch_torrent_metadata: true
  required: true
  min_items: 1
