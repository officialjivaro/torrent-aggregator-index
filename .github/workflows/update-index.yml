name: Update JTorrent Torrent Aggregator Index

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PYTHONUNBUFFERED: '1'

concurrency:
  group: jtorrent-aggregator-index-manual-fallback
  cancel-in-progress: false

jobs:
  build:
    name: Build static JSON backend
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python sources
        run: python -m compileall -q scripts tests

      - name: Audit source registry and fail-closed policy
        run: >-
          python scripts/audit_governance.py
          --config config/sources.yml
          --policy config/search-policy.json
          --output artifacts/backend-governance-static.json

      - name: Build JTorrent JSON files
        run: python scripts/build_index.py --config config/sources.yml --policy config/search-policy.json

      - name: Ensure Pages serves static files directly
        run: touch public/.nojekyll

      - name: Validate generated backend files and performance budget
        run: |
          python scripts/validate_v4_backend.py \
            --public-dir public \
            --minimum-items 30000 \
            --max-bytes 68719476736
          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("public/data/status.json").read_text(encoding="utf-8"))
          current = json.loads(Path("public/data/v4/current.json").read_text(encoding="utf-8"))
          v4 = json.loads(Path("public", current["manifest_path"]).read_text(encoding="utf-8"))
          health = json.loads(Path("public/data/source-health.json").read_text(encoding="utf-8"))
          print(
              f"Generated {status.get('item_count', 0):,} items with search {status.get('search_contract')}; "
              f"{status.get('healthy_source_count', 0)} healthy, "
              f"{status.get('failed_source_count', 0)} failed, "
              f"{len(health.get('disabled_sources', []))} policy-disabled sources; "
              f"{len(v4.get('doc_shards', []))} versioned document shards"
          )
          PY

      - name: Run final backend governance verification
        run: >-
          python scripts/verify_final_phase.py
          --generated-dir public
          --output artifacts/backend-final-verification.json

      - name: Upload backend governance evidence
        uses: actions/upload-artifact@v7
        with:
          name: backend-governance-${{ github.sha }}
          path: |
            artifacts/backend-governance-static.json
            artifacts/backend-governance-report.json
            artifacts/backend-final-verification.json
            public/data/status.json
            public/data/source-health.json
            public/data/manifest.json
            public/data/v4/current.json
            public/data/sources.json
          if-no-files-found: error
          retention-days: 30

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: public
          include-hidden-files: true

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
